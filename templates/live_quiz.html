{% extends "base.html" %}
{% block title %}Live Quiz{% endblock %}
{% block heading %}JavaScript Quiz{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='quiz.css') }}" />
{% endblock %}
{% block content %}

<div class="container">
  <section id="quizPanel">
    <p id="progress"></p>
    <p id="loading" class="status is-loading" role="status">Loading…</p>
    <p id="error" class="status is-error" role="alert" hidden></p>
    <h2 id="questionText"></h2>
    <div id="choices"></div>
    <div class="navigation">
      <button id="firstBtn" onclick="goFirst()" disabled>First</button>
      <button id="previousBtn" onclick="goPrevious()" disabled>Previous</button>
      <button id="nextBtn" onclick="goNext()" disabled>Next</button>
      <button id="lastBtn" onclick="goLast()" disabled>Last</button>
    </div>
    <button class="submit" onclick="submitQuiz()" disabled>Submit Quiz</button>

    <button class="submit" onclick="submitQuiz()">Submit Quiz</button>
  </section>
  <section id="resultsPanel">
    <h2 tabindex = "-1">Quiz Results</h2>
    <p id="scoreText"></p>
    <p id="percentageText"></p>
    <p id="performanceText"></p>
    <h3>Correction</h3>
    <pre id="correction"></pre>
  </section>
</div>
<script src="{{ url_for('static', filename='live_quiz.js') }}"></script>
{% endblock %}
